services:
  plantpal:
    build: .
    restart: unless-stopped
    # PID 1 init (tini): forwards signals to uvicorn for clean shutdown and reaps any
    # zombie children (e.g. from to_thread/subprocess work) — N17.
    init: true
    env_file: .env
    volumes:
      - plantpal-data:/data
    # No published host ports: Cloudflare Tunnel fronts the app over the compose
    # network. (For a VPS with open 80/443 you can use the legacy Caddy setup instead,
    # see Caddyfile + README.)
    expose:
      - "8000"

  # Cloudflare Tunnel: public ingress without router port-forwarding; TLS at the edge.
  # Create a tunnel in the Cloudflare dashboard, route getplantpal.com -> http://plantpal:8000,
  # and put its token in .env as CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - plantpal

  # Off-site SQLite replication (optional). Enable with: docker compose --profile backup up -d
  # The default backup path is the cron snapshot+rsync in scripts/backup.sh (K5).
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    profiles: ["backup"]
    env_file: .env
    volumes:
      - plantpal-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate

volumes:
  plantpal-data:
